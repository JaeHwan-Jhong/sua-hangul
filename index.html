<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="수아와 한글 크리스탈">
<title>수아와 한글 크리스탈</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0f2a">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
  /* 한 화면 게임: 480x320 논리 해상도를 화면에 맞춰 확대. FF 계열 '파란 창' 단일 테마 */
  :root { color-scheme:dark; --bg:#0b0f2a; --win-top:#2a3fc0; --win-bot:#121c6e; --ink:#1a2a8a; --paper:#ffffff; --paper2:#dde5ff; --gold:#ffd84d; --gold-ink:#b8860b; --text:#ffffff; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; color:var(--text);
    font-family:"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; }
  #wrap { position:fixed; left:env(safe-area-inset-left,0px); right:env(safe-area-inset-right,0px); top:env(safe-area-inset-top,0px); bottom:env(safe-area-inset-bottom,0px); background:var(--bg); }
  #stage { position:absolute; left:0; top:0; width:480px; height:320px; transform-origin:0 0; overflow:hidden; background:#000; }
  #game { position:absolute; left:0; top:0; width:480px; height:320px; display:block; }
  .hidden { display:none !important; }
  .ff { background:linear-gradient(180deg,var(--win-top) 0%,var(--win-bot) 100%); border:2px solid var(--paper); border-radius:6px;
        box-shadow:0 0 0 2px var(--ink), 0 3px 0 2px rgba(0,0,0,.45), inset 0 0 0 1px #93a6ff; color:var(--text); }
  .btn { background:linear-gradient(180deg,var(--paper),var(--paper2)); border:2px solid var(--ink); border-radius:12px; color:var(--ink);
         font-weight:800; cursor:pointer; box-shadow:0 3px 0 var(--ink); font-family:inherit; padding:6px 10px; font-size:15px; line-height:1.2; }
  .btn:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .btn:focus-visible { outline:3px solid var(--gold); outline-offset:1px; }
  .btn.wrong { opacity:.3; pointer-events:none; filter:grayscale(1); }
  .btn.right { background:linear-gradient(180deg,#fff8c2,var(--gold)); border-color:var(--gold-ink); box-shadow:0 3px 0 var(--gold-ink); }
  .btn.small { font-size:12px; padding:4px 8px; border-radius:8px; }
  .btn.locked { background:#3a3f6b; border-color:#2a2f55; color:#9aa3d8; box-shadow:0 3px 0 #2a2f55; }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  /* HUD */
  #hud { position:absolute; left:0; top:0; width:480px; height:30px; z-index:9; pointer-events:none; display:flex; align-items:center; justify-content:space-between; padding:3px 6px; box-sizing:border-box; }
  #hud .ff { padding:2px 8px; font-size:12px; font-weight:800; pointer-events:auto; }
  #hud-hearts { letter-spacing:-1px; font-size:12px; }
  #hud-crystals span { display:inline-block; width:12px; height:12px; margin:0 1px; transform:rotate(45deg); border:1px solid #fff; border-radius:2px; background:#555; opacity:.5; }
  #hud-crystals.stars span { transform:none; border-radius:50%; }
  #hud-crystals span.on { opacity:1; box-shadow:0 0 6px currentColor; }
  #hud-right { display:flex; gap:4px; align-items:center; }
  #btn-menu, #btn-ship { pointer-events:auto; width:26px; height:24px; padding:0; font-size:14px; border-radius:8px; }
  #toast { position:absolute; left:50%; top:36px; transform:translateX(-50%); padding:3px 12px; font-size:13px; font-weight:800; z-index:9; pointer-events:none; opacity:0; transition:opacity .4s; }
  #toast.show { opacity:1; }

  /* D-pad */
  #dpad { position:absolute; left:8px; bottom:8px; width:96px; height:96px; z-index:5; opacity:.75; }
  #dpad button { position:absolute; width:32px; height:32px; border-radius:8px; border:2px solid #1a2a8a; background:rgba(255,255,255,.85); color:#1a2a8a; font-size:16px; font-weight:900; padding:0; box-shadow:0 2px 0 #1a2a8a; touch-action:none; }
  #dpad button:active { background:#ffd84d; }
  #dpad .u { left:32px; top:0; } #dpad .d { left:32px; top:64px; } #dpad .l { left:0; top:32px; } #dpad .r { left:64px; top:32px; }

  /* Dialog */
  #dialog { position:absolute; left:20px; right:20px; bottom:14px; min-height:74px; z-index:30; padding:8px 12px 10px; box-sizing:border-box; font-size:14px; line-height:1.45; }
  #dlg-speaker { position:absolute; left:10px; top:-18px; background:#fff; color:#1a2a8a; border-radius:10px; padding:1px 8px; font-size:12px; font-weight:800; }
  #dlg-text { min-height:40px; white-space:pre-wrap; }
  #dlg-arrow { position:absolute; right:10px; bottom:4px; font-size:12px; animation:bob .7s infinite alternate; }
  #dlg-choices { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  @keyframes bob { from { transform:translateY(0);} to { transform:translateY(3px);} }

  /* Full screens */
  .screen { position:absolute; left:0; top:0; width:480px; height:320px; z-index:8; }
  #title { z-index:20; background:radial-gradient(ellipse at 50% 30%, #2d3fb5 0%, #121a52 55%, #070a24 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; overflow:hidden; }
  #title h1 { margin:0; font-size:34px; letter-spacing:1px; text-shadow:0 3px 0 #1a2a8a, 0 0 18px #7c9bff; }
  #title .sub { font-size:12px; opacity:.85; margin-bottom:6px; }
  #title .btns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #title .btn { font-size:16px; padding:8px 16px; }
  .star { position:absolute; width:3px; height:3px; background:#fff; border-radius:50%; animation:twinkle 2s infinite alternate; }
  @keyframes twinkle { from { opacity:.2; } to { opacity:1; } }
  .crystal-row { display:flex; gap:14px; margin-bottom:4px; }
  .crystal-row span { width:22px; height:22px; transform:rotate(45deg); border:2px solid #fff; border-radius:4px; display:inline-block; box-shadow:0 0 14px currentColor; animation:twinkle 1.5s infinite alternate; }

  /* Battle */
  #battle { background:linear-gradient(180deg,#8ad1ff 0%,#cdefff 55%,#6cbf5c 55%,#4e9e42 100%); }
  #battle.night { background:linear-gradient(180deg,#1f2a6e 0%,#4a4f9a 55%,#3d6e3a 55%,#2d4f2b 100%); }
  #battle.cave { background:linear-gradient(180deg,#3b2a4f 0%,#6b4f86 55%,#5a4636 55%,#3e2f26 100%); }
  #bt-arena { position:absolute; left:0; top:28px; width:480px; height:120px; }
  #bt-monster { position:absolute; left:60px; top:6px; width:140px; text-align:center; }
  #bt-mon-emoji { font-size:64px; line-height:1; animation:idle 1.6s ease-in-out infinite; filter:drop-shadow(0 6px 4px rgba(0,0,0,.35)); }
  #bt-mon-emoji.hit { animation:hit .5s; }
  #bt-mon-emoji.boss { font-size:72px; }
  @keyframes idle { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
  @keyframes hit { 0% { transform:translateX(0); filter:brightness(2);} 25% { transform:translateX(-10px) rotate(-8deg);} 50% { transform:translateX(8px);} 75% { transform:translateX(-5px);} 100% { transform:translateX(0);} }
  .bt-name { font-size:12px; font-weight:800; color:#fff; text-shadow:0 1px 0 #000, 0 0 4px #000; margin-top:2px; }
  .bt-hp { width:90px; height:8px; margin:3px auto 0; background:#333; border:1px solid #fff; border-radius:4px; overflow:hidden; }
  .bt-hp i { display:block; height:100%; background:linear-gradient(90deg,#ff5d5d,#ffb347); width:100%; transition:width .4s; }
  #bt-hero { position:absolute; right:70px; top:-6px; width:110px; text-align:center; }
  #bt-hero-canvas { width:86px; height:122px; }
  #bt-hero.attack { animation:attack .5s; }
  #bt-hero.shake { animation:shake .5s; }
  @keyframes attack { 0% { transform:translateX(0);} 40% { transform:translateX(-150px) scale(1.1);} 60% { transform:translateX(-150px);} 100% { transform:translateX(0);} }
  @keyframes shake { 0%,100% { transform:translateX(0);} 20% { transform:translateX(-6px);} 40% { transform:translateX(6px);} 60% { transform:translateX(-4px);} 80% { transform:translateX(4px);} }
  #bt-panel { position:absolute; left:10px; right:10px; bottom:8px; height:166px; padding:8px 10px; box-sizing:border-box; display:flex; flex-direction:column; }
  #bt-q { display:flex; align-items:center; gap:10px; min-height:42px; }
  #bt-big { font-size:28px; font-weight:900; min-width:44px; text-align:center; background:rgba(255,255,255,.15); border-radius:8px; padding:2px 8px; }
  #bt-prompt { font-size:16px; font-weight:800; flex:1; line-height:1.3; }
  #bt-replay { width:36px; height:36px; font-size:18px; padding:0; border-radius:10px; }
  #bt-opts { display:flex; gap:8px; justify-content:center; margin-top:6px; flex-wrap:wrap; }
  #bt-opts .btn { width:140px; height:72px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:2px; }
  #bt-opts .btn .em { font-size:36px; line-height:1; }
  #bt-opts .btn .tx { font-size:11px; font-weight:700; }
  #bt-opts .btn .big { font-size:28px; }
  #bt-opts.four { gap:6px; }
  #bt-opts.four .btn { width:214px; height:44px; flex-direction:row; gap:8px; }
  #bt-opts.four .btn .em { font-size:26px; }
  #bt-opts.four .btn .tx { font-size:14px; }
  #bt-opts.four .btn .big { font-size:22px; }
  #bt-msg { margin-top:auto; font-size:14px; font-weight:800; min-height:20px; text-align:center; color:#fff8c2; }
  #bt-dim { position:absolute; inset:0; background:rgba(0,0,0,.0); pointer-events:none; }
  .flash { animation:flash .4s; }
  @keyframes flash { 0% { background:rgba(255,255,255,.6);} 100% { background:rgba(255,255,255,0);} }

  /* Panels: Learn / Report / Menu / Closet */
  .panel { position:absolute; left:16px; top:34px; width:448px; height:272px; box-sizing:border-box; padding:8px 10px; z-index:28; display:flex; flex-direction:column; }
  .panel header { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .panel header h2 { margin:0; font-size:16px; flex:1; }
  .tabs { display:flex; gap:4px; }
  .tabs .btn.on { background:linear-gradient(180deg,#fff8c2,#ffd84d); }
  .grid { display:grid; gap:5px; flex:1; overflow:auto; align-content:start; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
  .grid .btn { font-size:20px; padding:4px 0; }
  .grid.chart { grid-template-columns:repeat(7,1fr); }
  .grid.jamo { grid-template-columns:repeat(7,1fr); }
  #learn-show { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.12); border-radius:10px; padding:6px 10px; margin-bottom:6px; min-height:52px; }
  #learn-show .ltr { font-size:34px; font-weight:900; min-width:50px; text-align:center; }
  #learn-show .words { display:flex; gap:10px; flex:1; flex-wrap:wrap; }
  #learn-show .words button { background:transparent; border:0; color:#fff; font-family:inherit; cursor:pointer; text-align:center; }
  #learn-show .words .em { font-size:28px; display:block; line-height:1; }
  #learn-show .words .tx { font-size:11px; font-weight:700; }
  table.rep { width:100%; border-collapse:collapse; font-size:12px; }
  table.rep th, table.rep td { border-bottom:1px solid rgba(255,255,255,.25); padding:3px 6px; text-align:center; }
  table.rep td.k { font-weight:800; font-size:14px; }
  #report-body { flex:1; overflow:auto; touch-action:pan-y; }
  #menu .btn { margin:3px 0; font-size:15px; }
  #menu .list { display:flex; flex-direction:column; gap:2px; }
  #closet-body { display:flex; gap:8px; flex:1; min-height:0; }
  #closet-left { width:150px; display:flex; flex-direction:column; align-items:center; gap:3px; }
  #closet-canvas { width:150px; height:150px; background:radial-gradient(circle at 50% 40%, #fff3fb 0%, #ffd6ee 70%, #f7b5dc 100%); border:2px solid #ffd84d; border-radius:12px; cursor:pointer; }
  #closet-left .hint { font-size:10px; opacity:.8; }
  #closet-left .hearts { font-size:11px; font-weight:800; color:#fff8c2; }
  #closet-right { flex:1; display:flex; flex-direction:column; min-width:0; }
  #closet-slots { display:flex; flex-wrap:wrap; gap:3px; margin-bottom:5px; }
  #closet-slots .btn { font-size:11px; padding:3px 5px; border-radius:7px; }
  #closet-items { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; overflow:auto; flex:1; align-content:start; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
  #closet-items .btn { padding:3px 2px; font-size:10px; display:flex; flex-direction:column; align-items:center; gap:1px; border-radius:9px; min-height:44px; justify-content:center; }
  #closet-items .btn .ic { font-size:20px; line-height:1; }
  .rotate-hint { position:fixed; inset:0; background:#0b0f2a; color:#fff; z-index:99; display:none; align-items:center; justify-content:center; font-size:20px; text-align:center; padding:20px; }
  @media (orientation:portrait) and (max-width:600px) { .rotate-hint { display:flex; } }

  /* confetti */
  #fx { position:absolute; inset:0; pointer-events:none; z-index:35; overflow:hidden; }
  .conf { position:absolute; width:8px; height:12px; top:-14px; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(340px) rotate(720deg); opacity:.6; } }
</style>
</head>
<body>
<div class="rotate-hint"><div>📱 기기를 가로로 돌려 주세요!<br><small>(가로 화면에서 더 잘 보여요)</small></div></div>
<div id="wrap">
<div id="stage">
  <canvas id="game" width="480" height="320"></canvas>

  <div id="hud">
    <div class="ff" id="hud-left"><span id="hud-name">수아 Lv.1</span> &nbsp;<span id="hud-hearts"></span></div>
    <div id="hud-right">
      <div class="ff" id="hud-crystals"><span></span><span></span><span></span><span></span></div>
      <button class="btn hidden" id="btn-ship" title="비공정">🎈</button>
      <button class="btn" id="btn-menu" title="메뉴">☰</button>
    </div>
  </div>
  <div id="toast" class="ff"></div>

  <div id="dpad">
    <button class="u" data-dir="up">▲</button>
    <button class="l" data-dir="left">◀</button>
    <button class="r" data-dir="right">▶</button>
    <button class="d" data-dir="down">▼</button>
  </div>

  <div id="dialog" class="ff hidden">
    <div id="dlg-speaker"></div>
    <div id="dlg-text"></div>
    <div id="dlg-choices"></div>
    <div id="dlg-arrow">▼</div>
  </div>

  <div id="battle" class="screen hidden">
    <div id="bt-arena">
      <div id="bt-monster"><div id="bt-mon-emoji">🦊</div><div class="bt-name" id="bt-mon-name">여우</div><div class="bt-hp"><i id="bt-mon-hp"></i></div></div>
      <div id="bt-hero"><canvas id="bt-hero-canvas" width="86" height="122"></canvas><div class="bt-name hidden" id="bt-hero-name">수아</div></div>
    </div>
    <div id="bt-panel" class="ff">
      <div id="bt-q"><div id="bt-big"></div><div id="bt-prompt"></div><button class="btn" id="bt-replay">🔊</button></div>
      <div id="bt-opts"></div>
      <div id="bt-msg"></div>
    </div>
    <div id="bt-dim"></div>
  </div>

  <div id="learn" class="panel ff hidden">
    <header><h2>📚 배움터</h2>
      <div class="tabs"><button class="btn small on" data-tab="cons">자음</button><button class="btn small" data-tab="vow">모음</button><button class="btn small" data-tab="chart">가나다</button><button class="btn small" data-tab="batchim">받침</button></div>
      <button class="btn small" id="learn-close">✖ 나가기</button></header>
    <div id="learn-show"><div class="ltr">ㄱ</div><div class="words"></div></div>
    <div id="learn-grid" class="grid jamo"></div>
  </div>

  <div id="closet" class="panel ff hidden">
    <header><h2>🪞 거울</h2><span id="closet-count" style="font-size:11px"></span><button class="btn small" id="closet-random">🎲 랜덤 코디</button><button class="btn small" id="closet-close">✖ 나가기</button></header>
    <div id="closet-body">
      <div id="closet-left"><canvas id="closet-canvas" width="150" height="150"></canvas><div class="hint">거울을 톡! 누르면 돌아요</div><div class="hearts" id="closet-hearts"></div></div>
      <div id="closet-right"><div id="closet-slots"></div><div id="closet-items"></div></div>
    </div>
  </div>

  <div id="voices" class="panel ff hidden">
    <header><h2>🎙️ 목소리 고르기</h2><button class="btn small" id="voices-close">✖ 닫기</button></header>
    <div id="voices-rate" style="display:flex;gap:6px;align-items:center;font-size:12px;margin-bottom:6px;flex-wrap:wrap"></div>
    <div id="voices-list" class="grid" style="grid-template-columns:1fr 1fr;flex:1"></div>
    <div id="voices-hint" style="font-size:10px;opacity:.85;margin-top:5px;line-height:1.4"></div>
  </div>

  <div id="report" class="panel ff hidden">
    <header><h2>📊 학습 기록</h2><span id="report-sum" style="font-size:12px"></span><button class="btn small" id="report-close">✖ 닫기</button></header>
    <div id="report-body"></div>
  </div>

  <div id="menu" class="panel ff hidden" style="left:140px;width:200px;top:40px;height:auto;">
    <header><h2>⚙️ 메뉴</h2><button class="btn small" id="menu-close">✖</button></header>
    <div class="list">
      <button class="btn" id="menu-bgm">🎵 배경음: 켬</button>
      <button class="btn" id="menu-sound">🔔 효과음: 켬</button>
      <button class="btn" id="menu-tts">🗣️ 음성 안내: 켬</button>
      <button class="btn" id="menu-voice">🎙️ 목소리 고르기</button>
      <button class="btn" id="menu-report">📊 학습 기록</button>
      <button class="btn" id="menu-title">💾 저장하고 처음 화면</button>
    </div>
  </div>

  <div id="fx"></div>

  <div id="title" class="screen">
    <div class="crystal-row"><span style="color:#4ade80;background:#4ade80"></span><span style="color:#60a5fa;background:#60a5fa"></span><span style="color:#f87171;background:#f87171"></span><span style="color:#fde047;background:#fde047"></span></div>
    <h1>수아와 한글 크리스탈</h1>
    <div class="sub">빛을 잃은 크리스탈을 되찾는 한글 모험 · 테스트 v0.2.2</div>
    <div class="btns">
      <button class="btn hidden" id="t-continue">▶ 이어하기</button>
      <button class="btn" id="t-new">✨ 새로 시작</button>
      <button class="btn" id="t-report">📊 기록</button>
    </div>
    <div class="sub" style="margin-top:10px;font-size:11px;opacity:.7">화면을 톡! 누르면 걸어가요 · 키보드 화살표도 OK · 🔊 소리를 켜 주세요</div>
  </div>
</div>
</div>

<script>
'use strict';
/* =====================================================================
   ① 내용 데이터 — 여기만 고치면 문제/캐릭터/아이템이 바뀝니다
   ===================================================================== */
const VERSION = 'v0.2.2';
const HERO_NAME = '수아';
const RESPAWN_STEPS = 60;      // 몬스터가 다시 나타나기까지 걸음 수
const MOVE_MS = 150;           // 한 칸 이동 시간(ms)
const DROP_CHANCE = {w1:0.5, w2:0.65};   // 일반 몬스터 아이템 드랍 확률

// 자음: 이름 + (이모지, 낱말) 예시 — 모든 낱말은 그 자음으로 시작
const CONS = [
  {j:'ㄱ', n:'기역', w:[['🎒','가방'],['🐢','거북이'],['🐱','고양이'],['🚂','기차'],['🐻','곰']]},

function shade(hex, p){ // 색 밝기 조절: p<0 어둡게, p>0 밝게

function artCall(id, phase, c, dir, frame, extra){ const a = id && ITEM_ART[id]; if (a && a[phase]) a[phase](c, dir, frame, extra); }
function drawHero(c, x, y, dir, frame, s=1, o=state.outfit){
  c.save(); c.translate(x, y-12); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  if (dir === 'right'){ c.translate(32, 0); c.scale(-1, 1); dir = 'left'; }
  const hc = HAIR_COLORS[o.haircolor] || '#4a2a12'; const hx = {hc, hcL:shade(hc,.38), hcD:shade(hc,-.3)};
  const lf = {l: frame===1 ? 1.5 : 0, r: frame===3 ? 1.5 : 0}; const bob = (frame===1 || frame===3) ? -0.8 : 0;
  el(c, 16, 42.6, 9, 2.4, 'rgba(0,0,0,.22)');                                          // 그림자
  c.translate(0, bob);
  if (dir !== 'up') artCall(o.back, 'back', c, dir, frame);                              // 날개/망토/가방 (뒤)
  artCall(o.hair, 'back', c, dir, frame, hx);                                            // 뒷머리(양갈래·긴머리 등)
  rrO(c, 12, 35-lf.l, 3.6, 6.8, 1.3, SKIN); rrO(c, 16.4, 35-lf.r, 3.6, 6.8, 1.3, SKIN);  // 다리
  rr(c, 12.3, 38.5-lf.l, 3, 2, '#fff'); rr(c, 16.7, 38.5-lf.r, 3, 2, '#fff');           // 양말
  artCall(o.outfit, 'legs', c, dir, frame, lf);                                          // 바지
  artCall(o.shoes, 'main', c, dir, frame, lf);                                           // 신발
  rrO(c, 6.3, 24.5, 3.4, 9, 1.6, SKIN); rrO(c, 22.3, 24.5, 3.4, 9, 1.6, SKIN);           // 팔
  ciO(c, 8, 34, 1.9, SKIN); ciO(c, 24, 34, 1.9, SKIN);                                   // 손
  rr(c, 14.3, 21.5, 3.4, 3.5, SKIN_D);                                                   // 목
  artCall(o.outfit, 'main', c, dir, frame);                                              // 옷
  if (dir === 'up') artCall(o.back, 'back', c, dir, frame); else artCall(o.back, 'over', c, dir, frame);
  artCall(o.wrist, 'main', c, dir, frame); if (dir !== 'up') artCall(o.neck, 'main', c, dir, frame);
  ciO(c, 16, 13.5, 10.5, SKIN);                                                          // 얼굴
  if (dir !== 'up'){ drawFace(c, dir, o); artCall(o.face, 'main', c, dir, frame); }
  artCall(o.hair, 'main', c, dir, frame, hx);                                            // 윗머리+앞머리(+장식)
  artCall(o.hat, 'main', c, dir, frame, hx);
  artCall(o.hand, 'main', c, dir, frame);
  c.restore();
}

const hero = {x:START.x, y:START.y, px:START.x, py:START.y, dir:'down', moving:false, t:0, from:null, to:null, frame:0, path:[], justPorted:false};
const held = {up:false, down:false, left:false, right:false}; let lastDir = null;
const DIRS = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};
const ui = {open:0}; const busy = () => ui.open > 0;
const clearHeld = () => { for (const k in held) held[k] = false; };
const tileAt = (x, y) => (x<0||y<0||x>=cur.w||y>=cur.h) ? (cur.outdoor ? '~' : '#') : cur.rows[y][x];
function walkable(x, y){ if (x<0||y<0||x>=cur.w||y>=cur.h) return false; const t = cur.rows[y][x]; return cur.outdoor ? (state.flying || OUT_WALK.includes(t)) : IN_WALK.includes(t); }
const isFurniture = (x, y) => !cur.outdoor && IN_USE.includes(tileAt(x, y));
function tryMove(dir){
  if (hero.moving || busy()) return false;
  hero.dir = dir; const [dx,dy] = DIRS[dir]; const nx = hero.x+dx, ny = hero.y+dy;
  if (!walkable(nx, ny)){ if (isFurniture(nx, ny)){ hero.path = []; clearHeld(); useFurniture(tileAt(nx, ny)); } return false; }
  hero.moving = true; hero.from = {x:hero.x, y:hero.y}; hero.to = {x:nx, y:ny}; hero.t = 0; return true;
}
function bfsPath(tx, ty){
  const dest = (x,y) => x===tx && y===ty;
  if (!walkable(tx, ty) && !isFurniture(tx, ty)) return null;
  // 마을/신전/동굴/탑/성/오두막은 '목적지'일 때만 지나감 (지나가다 멈추지 않도록). 가구는 목적지로만 허용
  const passable = (x,y) => dest(x,y) ? true : (walkable(x,y) && (state.flying || !cur.outdoor || !'VTCWKIZ'.includes(cur.rows[y][x])));
  const key = (x,y) => y*cur.w+x; const prev = new Map(); const q = [[hero.x, hero.y]]; prev.set(key(hero.x,hero.y), null);
  while (q.length){ const [x,y] = q.shift(); if (dest(x,y)) break;
    for (const d of ['up','down','left','right']){ const nx = x+DIRS[d][0], ny = y+DIRS[d][1];
      if (nx<0||ny<0||nx>=cur.w||ny>=cur.h) continue;
      if (passable(nx,ny) && !prev.has(key(nx,ny))) { prev.set(key(nx,ny), d); q.push([nx,ny]); } } }
  if (!prev.has(key(tx,ty))) return null;
  const path = []; let cx = tx, cy = ty;
  while (!(cx===hero.x && cy===hero.y)){ const d = prev.get(key(cx,cy)); path.push(d); cx -= DIRS[d][0]; cy -= DIRS[d][1]; }
  return path.reverse();
}
function onArrive(count=true){
  if (count){ state.steps++; if (state.steps % 5 === 0) save(); }
  const t = tileAt(hero.x, hero.y);
  if (t !== 'P') hero.justPorted = false;
  if (!cur.outdoor){ if (t==='D'){ hero.path = []; exitHouse(); } return; }
  if (state.flying){ if (t==='P' && !hero.justPorted){ hero.path = []; portal(); } return; }
  const m = monsterAt(hero.x, hero.y); if (m){ hero.path = []; startBattle(m); return; }
  const ch = chestAt(hero.x, hero.y); if (ch){ hero.path = []; openChest(ch); return; }
  if (t==='V'){ hero.path = []; enterHouse(); return; }
  if (t==='I'){ hero.path = []; fairyHut(); return; }
  if (t==='Z'){ hero.path = []; finalGate(); return; }
  if (BOSSES[state.map] && BOSSES[state.map][t]){ hero.path = []; bossGate(t); return; }
}
function enterMap(name, x, y, dir){

const dlg = {el:$('#dialog'), text:$('#dlg-text'), choices:$('#dlg-choices'), speaker:$('#dlg-speaker'), arrow:$('#dlg-arrow'), lines:[], i:0, typing:null, resolve:null, opts:null, full:''};
function showDialog(lines, opts={}){
  return new Promise(res => {
    dlg.lines = Array.isArray(lines) ? lines : [lines]; dlg.i = 0; dlg.resolve = res; dlg.opts = opts;
    dlg.speaker.textContent = opts.speaker || ''; dlg.speaker.classList.toggle('hidden', !opts.speaker);

function dialogLineDone(){
  const last = dlg.i === dlg.lines.length-1;
  if (last && dlg.opts.choices){

    dlg.opts.choices.forEach(ch => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = ch.label; b.onclick = (e) => { e.stopPropagation(); SFX.select(); closeDialog(ch.value); }; dlg.choices.appendChild(b); });

function dialogAdvance(){
  if (dlg.el.classList.contains('hidden')) return;
  if (dlg.typing){ clearInterval(dlg.typing); dlg.typing = null; dlg.text.textContent = dlg.full; dialogLineDone(); return; }

const ALL_WORDS = (() => { const seen = new Set(), out = []; [...CONS, ...VOWELS].forEach(g => g.w.forEach(([e,w]) => { if (!seen.has(w)){ seen.add(w); out.push({e, w}); } })); return out; })();
const LONG_BANK = (() => { const seen = new Set(), out = []; LONG_WORDS.forEach(([e,w]) => { if (!seen.has(w)){ seen.add(w); out.push({e, w}); } }); return out; })();
function emojiOpt(e, w, correct){ return {emoji:e, text:w, correct}; }
function textOpt(t, correct){ return {big:t, correct}; }
function othersFrom(groups, excludeJ, n){ const pool = groups.filter(g => g.j!==excludeJ && g.w.length); const out = []; const used = new Set();
  for (const g of shuffle(pool)){ if (out.length>=n) break; const [e,w] = pick(g.w); if (used.has(w)) continue; used.add(w); out.push([e,w]); } return out; }
function fillOpts(correctLabel, candidates, n, mk){ // candidates: 중복 없는 후보 라벨 목록에서 n-1개
  const used = new Set([correctLabel]); const out = [];
  for (const cnd of candidates){ if (out.length >= n-1) break; if (used.has(cnd)) continue; used.add(cnd); out.push(mk(cnd, false)); }
  return out;
}
// 같은 길이·같은 첫 글자 우선으로 낱말 방해 보기 고르기
function wordDistractors(bank, w, n){
  const same = shuffle(bank.filter(x => x.w!==w && x.w.length===w.length)); const first = same.filter(x => x.w[0]===w[0]);
  const rest = shuffle(bank.filter(x => x.w!==w && x.w.length!==w.length));
  return [...first, ...same.filter(x => !first.includes(x)), ...rest].slice(0, n-1);
}

function genQuestion(mod, boss, n=3){
  const canListen = TTS.canListen;
  if (mod==='X') mod = pick(['E','F','G','H']);
  if (mod==='A'){
    const c = pickWeighted(CONS, g => 'A:'+g.j); const key = 'A:'+c.j;
    if (Math.random() < (boss ? 0.5 : 0.65)){
      const [e,w] = pick(c.w); const others = othersFrom(CONS, c.j, n-1);
      return {key, big:c.j, prompt:`<b>${c.j}</b>(${euro(c.n)}) 시작하는 그림은?`, tts:`${c.n}! ${euro(c.n)} 시작하는 그림은 뭘까?`, options:shuffle([emojiOpt(e,w,true), ...others.map(([e2,w2]) => emojiOpt(e2,w2,false))])};
    }
    const [e,w] = pick(c.w); const oj = shuffle(CONS.filter(g => g.j!==c.j)).slice(0,n-1);
    return {key, big:e, prompt:`<b>${w}</b>${hasBatchim(w)?'은':'는'} 어떤 글자로 시작할까?`, tts:`${w}! ${josa(w,'은','는')} 어떤 글자로 시작할까?`, options:shuffle([textOpt(c.j,true), ...oj.map(g => textOpt(g.j,false))])};
  }
  if (mod==='B'){
    const vs = VOWELS.filter(v => v.w.length >= 2); const v = pickWeighted(vs, g => 'B:'+g.j); const key = 'B:'+v.j;
    if (Math.random() < 0.6 || !canListen){
      const [e,w] = pick(v.w); const others = othersFrom(VOWELS, v.j, n-1);
      return {key, big:v.n, prompt:`<b>${v.n}</b> 소리로 시작하는 그림은?`, tts:`${v.n}! ${v.n} 소리로 시작하는 그림은 뭘까?`, options:shuffle([emojiOpt(e,w,true), ...others.map(([e2,w2]) => emojiOpt(e2,w2,false))])};
    }
    const ov = shuffle(VOWELS.filter(g => g.j!==v.j && g.w.length)).slice(0,n-1);
    return {key, big:'🔊', prompt:`들리는 글자를 찾아봐!`, tts:`${v.n}. ${v.n}를 찾아봐!`, replay:`${v.n}`, options:shuffle([textOpt(v.n,true), ...ov.map(g => textOpt(g.n,false))])};
  }
  if (mod==='C'){
    const c = pickWeighted(CONS, g => 'C:'+g.j); const vj = pick(CHART_VOWELS); const v = VOWELS.find(x => x.j===vj);
    const s = compose(c.j, vj); const key = 'C:'+s;
    const sameC = shuffle(CHART_VOWELS.filter(x => x!==vj)).map(x => compose(c.j, x));
    const sameV = shuffle(CONS.filter(g => g.j!==c.j)).map(g => compose(g.j, vj));
    const cands = Math.random()<0.5 ? [sameC[0], sameV[0], sameC[1], sameV[1]] : [sameC[0], sameC[1], sameV[0], sameC[2]];
    const opts = fillOpts(s, cands, n, textOpt);
    if (Math.random() < 0.55 || !canListen){
      return {key, big:`${c.j}+${vj}`, prompt:`<b>${c.j}</b> 하고 <b>${vj}</b> 를 합치면?`, tts:`${c.n} 하고 ${v.n}를 합치면 무슨 글자가 될까?`, options:shuffle([textOpt(s,true), ...opts])};
    }
    return {key, big:'🔊', prompt:`들리는 글자를 찾아봐!`, tts:`${s}. ${s}를 찾아봐!`, replay:`${s}`, options:shuffle([textOpt(s,true), ...opts])};
  }
  if (mod==='D'){
    const words = ALL_WORDS.filter(x => x.w.length <= 4);
    const it = pickWeighted(words, x => 'D:'+x.w); const key = 'D:'+it.w;
    if (it.w.length === 1 || Math.random() < 0.55){
      const others = wordDistractors(words, it.w, n);
      return {key, big:it.e, prompt:`이 그림은 뭐라고 쓸까?`, tts:`${it.w}! ${josa(it.w,'은','는')} 어떤 글자일까?`, options:shuffle([textOpt(it.w,true), ...others.map(o => textOpt(o.w,false))])};
    }
    return missingSyllable(it, words, key, n);
  }
  if (mod==='E'){
    const c = pickWeighted(CONS, g => 'E:'+g.j); const vj = pick(['ㅏ','ㅗ','ㅜ','ㅣ']); const f = pick(FINALS);
    const s = compose(c.j, vj, f.i); const key = 'E:'+s;
    const cands = shuffle(FINALS.filter(x => x.i!==f.i)).map(x => compose(c.j, vj, x.i)); cands.push(compose(c.j, vj));
    const opts = fillOpts(s, cands, n, textOpt);
    if (Math.random() < 0.5 || !canListen){
      return {key, big:`${c.j}+${vj}+${f.j}`, prompt:`<b>${c.j}</b> + <b>${vj}</b> + 받침 <b>${f.j}</b> = ?`, tts:`${c.n} 하고 ${VOW_NAME(vj)}, 받침 ${josa(f.n,'을','를')} 합치면 무슨 글자가 될까?`, options:shuffle([textOpt(s,true), ...opts])};
    }
    return {key, big:'🔊', prompt:`들리는 글자를 찾아봐! (받침)`, tts:`${s}. ${josa(s,'을','를')} 찾아봐!`, replay:`${s}`, options:shuffle([textOpt(s,true), ...opts])};
  }
  if (mod==='F'){
    if (Math.random() < 0.55 || !canListen){   // 복합모음 합치기
      const [a, b, r] = pick(COMPLEX_VOWELS); const cj = Math.random()<0.5 ? 'ㅇ' : pick(['ㄱ','ㄷ','ㅅ','ㅈ','ㅎ']);
      const s = compose(cj, r); const key = 'F:'+s;
      const cands = shuffle(COMPLEX_VOWELS.filter(x => x[2]!==r)).map(x => compose(cj, x[2]));
      const opts = fillOpts(s, cands, n, textOpt);
      const pre = cj==='ㅇ' ? '' : `<b>${cj}</b> + `; const preT = cj==='ㅇ' ? '' : `${CONS_NAME(cj)} 하고 `;
      return {key, big:`${a}+${b}`, prompt:`${pre}<b>${a}</b> + <b>${b}</b> = ?`, tts:`${preT}${VOW_NAME(a)} 하고 ${VOW_NAME(b)}를 합치면 무슨 글자가 될까?`, options:shuffle([textOpt(s,true), ...opts])};
    }
    const fam = pick(TENSE_FAMILIES); const vj = pick(['ㅏ','ㅓ','ㅗ','ㅜ','ㅣ']);
    const target = Math.random()<0.6 ? fam[1] : pick(fam); const s = compose(target, vj); const key = 'F:'+s;
    const cands = shuffle(fam.filter(x => x!==target)).map(x => compose(x, vj)); cands.push(compose(pick(TENSE_FAMILIES.filter(f => f!==fam))[1], vj));
    const opts = fillOpts(s, cands, n, textOpt);
    return {key, big:'🔊', prompt:`들리는 글자를 찾아봐! (쌍자음)`, tts:`${s}. ${josa(s,'을','를')} 찾아봐!`, replay:`${s}`, options:shuffle([textOpt(s,true), ...opts])};
  }
  if (mod==='G'){
    const it = pickWeighted(LONG_BANK, x => 'G:'+x.w); const key = 'G:'+it.w; const r = Math.random();
    if (r < 0.4 && canListen){
      const others = wordDistractors(LONG_BANK, it.w, n);
      return {key, big:'🔊', prompt:`들리는 낱말을 찾아봐!`, tts:`${it.w}. ${josa(it.w,'을','를')} 찾아봐!`, replay:`${it.w}`, options:shuffle([textOpt(it.w,true), ...others.map(o => textOpt(o.w,false))])};
    }
    if (r < 0.7){
      const others = wordDistractors(LONG_BANK, it.w, n);
      return {key, big:it.e, prompt:`이 그림은 뭐라고 쓸까?`, tts:`${it.w}! ${josa(it.w,'은','는')} 어떤 글자일까?`, options:shuffle([textOpt(it.w,true), ...others.map(o => textOpt(o.w,false))])};
    }
    return missingSyllable(it, LONG_BANK, key, n);
  }
  // H 문장
  const subj = pick(SUBJECTS); const tpl = pick(SENT); const [e, noun] = pick(tpl.nouns);
  if (Math.random() < 0.6){   // 낱말 빈칸: "수아가 ___ 먹어요"
    const key = 'H:'+noun; const correct = josa(noun,'을','를');
    const cands = shuffle(SENT.flatMap(t => t.nouns.map(x => x[1]))).filter(x => x!==noun).map(x => josa(x,'을','를'));
    const opts = fillOpts(correct, cands, n, textOpt);
    return {key, big:e, prompt:`${josa(subj,'이','가')} <b>___</b> ${tpl.verb}.`, tts:`${josa(subj,'이','가')}, 무엇을 ${tpl.verb}? 그림을 보고 빈칸에 들어갈 말을 골라봐!`, options:shuffle([textOpt(correct,true), ...opts])};
  }
  const key = 'H:v:'+tpl.verb;
  const cands = shuffle(SENT.map(t => t.verb)).filter(v => v!==tpl.verb);
  const opts = fillOpts(tpl.verb, cands, n, textOpt);
  return {key, big:e, prompt:`${josa(subj,'이','가')} ${josa(noun,'을','를')} <b>___</b>.`, tts:`${josa(subj,'이','가')} ${josa(noun,'을','를')}, 어떻게 할까? 알맞은 말을 골라봐!`, options:shuffle([textOpt(tpl.verb,true), ...opts])};
}
function missingSyllable(it, bank, key, n){
  const k = rnd(it.w.length); const missing = it.w[k]; const shown = it.w.slice(0,k) + '□' + it.w.slice(k+1);
  const bankSet = new Set(bank.map(x => x.w));
  const pool = []; bank.forEach(x => { for (const ch of x.w) if (ch!==missing && !pool.includes(ch) && !bankSet.has(it.w.slice(0,k)+ch+it.w.slice(k+1))) pool.push(ch); });
  const others = shuffle(pool).slice(0, n-1);
  return {key, big:it.e, prompt:`<b>${shown}</b> — 빠진 글자는?`, tts:`${it.w}! ${it.w}. 빠진 글자는 뭘까?`, options:shuffle([textOpt(missing,true), ...others.map(o => textOpt(o,false))])};
}

function rollDrop(m){

  const list = $('#voices-list'); list.innerHTML = '';
  if (!('speechSynthesis' in window)) list.innerHTML = '<p style="font-size:12px">이 브라우저는 음성 안내를 지원하지 않아요.</p>';
  else if (!TTS.list.length) list.innerHTML = '<p style="font-size:12px">한국어 목소리를 아직 못 찾았어요. 잠시 뒤 다시 열어 보거나, 아래 안내대로 목소리를 받아 주세요.</p>';
  TTS.list.slice().sort((a,b) => TTS.quality(b) - TTS.quality(a)).forEach(v => {
    const b = document.createElement('button'); const on = TTS.voice && TTS.voice.voiceURI === v.voiceURI;
    b.className = 'btn' + (on ? ' right' : ''); b.style.fontSize = '13px'; b.style.padding = '6px 4px';
    b.innerHTML = `${on ? '✅ ' : ''}${v.name} <span style="font-size:10px;opacity:.75">· ${TTS.qualityName(v)}${v.localService === false ? ' · 온라인' : ''}</span>`;
    b.onclick = () => { state.voiceURI = v.voiceURI; TTS.voice = v; save(); SFX.select(); TTS.say(SAMPLE_LINE); renderVoices(); };
    list.appendChild(b);
  });
  $('#voices-hint').innerHTML = '목록에 <b>프리미엄</b>이 없으면 기기에서 받아 주세요 → 아이패드/아이폰: 설정 → 손쉬운 사용 → 콘텐츠 말하기 → 음성 → 한국어 → 유나 → <b>유나(프리미엄)</b> 다운로드 → 앱을 완전히 닫았다가 다시 열기. 맥: 시스템 설정 → 손쉬운 사용 → 콘텐츠 말하기 → 시스템 음성 → 음성 관리.';
}
$('#voices-close').addEventListener('click', () => { $('#voices').classList.add('hidden'); ui.open--; });
$('#menu-title').addEventListener('click', () => { save(); toggleMenu(); showTitle(); });

function showTitle(){ state.started = false; $('#title').classList.remove('hidden'); ui.open++; $('#t-continue').classList.toggle('hidden', !hasSave()); BGM.play('house'); }
function startGame(fresh){
  audioInit(); TTS.init();
  if (fresh){ resetState(); } else { load(); }
  recalcHearts(); cur = MAPS[state.map] || MAPS.w1; state.map = cur.id; ensureBase(cur);
  hero.x = state.hero.x; hero.y = state.hero.y; hero.px = hero.x; hero.py = hero.y; hero.dir = state.hero.dir || 'down'; hero.moving = false; hero.path = [];
  if (!walkable(hero.x, hero.y) && !state.flying){ hero.x = START.x; hero.y = START.y; hero.px = hero.x; hero.py = hero.y; cur = MAPS.w1; state.map = 'w1'; }
  state.started = true; $('#title').classList.add('hidden'); ui.open--; updateHUD(); BGM.play(cur.bgm); toast(cur.toast);
  if (fresh){ showDialog(INTRO, {speaker:'✨ 크리스탈'}).then(save); } else { TTS.say(`${HERO_NAME}의 모험을 이어서 시작해요!`); }
}
$('#t-new').addEventListener('click', async () => {
  audioInit();
  if (hasSave()){ const v = await showDialog(['저장된 모험이 있어요. 처음부터 다시 시작할까요? (아이템도 사라져요)'], {choices:[{label:'처음부터', value:true},{label:'취소', value:false}]}); if (!v) return; }
  startGame(true);
});
$('#t-continue').addEventListener('click', () => startGame(false));
$('#t-report').addEventListener('click', () => { load(); openReport(); });
for (let i=0;i<40;i++){ const s = document.createElement('span'); s.className='star'; s.style.left = rnd(480)+'px'; s.style.top = rnd(320)+'px'; s.style.animationDelay = (Math.random()*2)+'s'; $('#title').appendChild(s); }

function confetti(n){ const fx = $('#fx'); const cols = ['#ff5a5a','#ffd166','#4ade80','#60a5fa','#f472b6','#fff'];
  for (let i=0;i<n;i++){ const d = document.createElement('div'); d.className='conf'; d.style.left = rnd(480)+'px'; d.style.background = pick(cols); d.style.animationDuration = (1.4+Math.random()*1.2)+'s'; d.style.animationDelay = (Math.random()*0.6)+'s'; fx.appendChild(d); setTimeout(() => d.remove(), 3200); } }

/* =====================================================================
   ⑭ 메인 루프
   ===================================================================== */
let last = performance.now(), walkClock = 0;
function update(dt){
  if (hero.moving){
    hero.t += dt/MOVE_MS;
    if (hero.t >= 1){ hero.x = hero.to.x; hero.y = hero.to.y; hero.px = hero.x; hero.py = hero.y; hero.moving = false; onArrive(); }
    else { hero.px = hero.from.x + (hero.to.x-hero.from.x)*hero.t; hero.py = hero.from.y + (hero.to.y-hero.from.y)*hero.t; }
    walkClock += dt; hero.frame = Math.floor(walkClock/110)%4;
  } else { hero.frame = 0; }
  if (!hero.moving && !busy()){
    const any = ['up','down','left','right'].find(k => held[k]);
    const d = any ? (held[lastDir] ? lastDir : any) : null;
    if (d){ tryMove(d); }
    else if (hero.path.length){ const nd = hero.path.shift(); if (!tryMove(nd)) hero.path = []; }
  }
  const mw = cur.w*TILE, mh = cur.h*TILE, vw = VIEW_W*TILE, vh = VIEW_H*TILE;
  cam.x = mw <= vw ? (mw-vw)/2 : clamp(hero.px*TILE + TILE/2 - vw/2, 0, mw-vw);
  cam.y = mh <= vh ? (mh-vh)/2 : clamp(hero.py*TILE + TILE/2 - vh/2, 0, mh-vh);
}
function render(now){
  ctx.setTransform(scale*dpr, 0, 0, scale*dpr, 0, 0);
  ctx.fillStyle = cur.outdoor ? '#2f74d0' : '#1a1026'; ctx.fillRect(0, 0, 480, 320);
  ctx.drawImage(ensureBase(cur), -cam.x, -cam.y);
  const x0 = Math.floor(cam.x/TILE), y0 = Math.floor(cam.y/TILE);
  if (cur.outdoor){
    for (let y=y0; y<=y0+VIEW_H; y++) for (let x=x0; x<=x0+VIEW_W; x++){
      const t = tileAt(x,y); const sx = x*TILE-cam.x, sy = y*TILE-cam.y;
      if (t==='~'){ const h = hash(x,y); const off = ((now/600 + h*10) % 1) * 20; ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(sx + 4 + off, sy + 8 + ((h*20)|0), 7, 2); }
      if (t==='P'){ drawPortal(ctx, sx, sy, now); }
      if (t==='Z'){ if (state.finalDone) star(ctx, sx+16, sy-6+Math.sin(now/400)*2, 7, '#ffd84d'); else { ctx.globalAlpha = .25+Math.sin(now/500)*.1; ci(ctx, sx+16, sy+10, 16, '#c084fc'); ctx.globalAlpha = 1; } }
      else if (BOSSES[state.map] && BOSSES[state.map][t]){ const b = BOSSES[state.map][t]; const lit = (state.map==='w2' ? state.stars : state.crystals)[b.idx]; const by = Math.sin(now/400)*2; drawCrystal(ctx, sx+16, sy+(t==='K'?-6:2)+by, b.color, lit, state.map==='w2'); }
    }
    for (const ch of CHESTS){ if (ch.map!==state.map) continue; const sx = ch.x*TILE-cam.x, sy = ch.y*TILE-cam.y; if (sx<-TILE||sy<-TILE||sx>480||sy>320) continue; drawChest(ctx, sx, sy, !!state.chests[ch.id]); }
    for (const m of MONSTERS){ if (m.map!==state.map || !monsterActive(m)) continue; const sx = m.x*TILE-cam.x, sy = m.y*TILE-cam.y; if (sx<-TILE||sy<-TILE||sx>480||sy>320) continue;
      el(ctx, sx+16, sy+28, 9, 3, 'rgba(0,0,0,.25)'); emojiAt(ctx, m.e, sx+16, sy+15 + Math.sin(now/300 + m.x)*2, 22); }
  }
  const hx = hero.px*TILE-cam.x, hy = hero.py*TILE-cam.y;
  if (state.flying && cur.outdoor) drawAirship(ctx, hx, hy-4, now); else drawHero(ctx, hx, hy, hero.dir, hero.frame);
}
function loop(now){ const dt = Math.min(50, now-last); last = now; if (state.started) update(dt); render(now); requestAnimationFrame(loop); }
window.addEventListener('beforeunload', () => { if (state.started) save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden){ if (state.started) save(); BGM.stop(); } else { BGM.resume(); } });
document.addEventListener('pointerdown', () => audioInit(), {once:false});
ensureBase(cur); updateHUD(); showTitle(); TTS.init(); requestAnimationFrame(loop);
// ---- 홈 화면 앱(PWA): 오프라인 캐시 + 자동 업데이트 (https 에서만 동작) ----
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; if (!state.started) location.reload(); });
  });
}
// iOS 사파리(앱 아님)에서 열었을 때 설치 안내
if (navigator.standalone === false) { const h = document.createElement('div'); h.className = 'sub'; h.style.cssText = 'font-size:11px;margin-top:4px;color:#ffd84d'; h.textContent = '📲 공유 버튼 → "홈 화면에 추가" 하면 앱처럼 전체 화면으로 할 수 있어요'; $('#title').appendChild(h); }
</script>
